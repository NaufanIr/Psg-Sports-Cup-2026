  ["SF-2","Jumat, 21 Agt 2026","17:35","Semifinal","Best of 5","WIN_QF-2","WIN_QF-4","Dimas"],

/* =========================================================================
   STATE
========================================================================= */
let PESERTA = [];   // {Grup, Pasangan}
let JADWAL  = [];   // {MatchID, Tanggal, Jam, Babak, Format, TimA, TimB, Wasit, Skor}
let refreshTimer = null;

/* =========================================================================
   CSV PARSER (menangani field ber-quote & koma di dalam field)
========================================================================= */
function parseCSV(text){
  const rows=[]; let row=[], field='', i=0, q=false;
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  while(i<text.length){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; }
      else field+=c;
    } else {
      if(c==='"') q=true;
      else if(c===',') { row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
    i++;
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows;
}
// CSV -> array of objects, keyed by header (case-insensitive)
function csvToObjects(text){
  const rows=parseCSV(text).filter(r=>r.some(c=>String(c).trim()!==''));
  if(!rows.length) return [];
  const headers=rows[0].map(h=>String(h).trim());
  return rows.slice(1).map(r=>{
    const o={}; headers.forEach((h,idx)=>o[h]=(r[idx]!==undefined?String(r[idx]).trim():'')); return o;
  });
}
// akses field object secara case-insensitive
function pick(obj,name){
  if(obj[name]!==undefined) return obj[name];
  const k=Object.keys(obj).find(k=>k.toLowerCase()===name.toLowerCase());
  return k!==undefined?obj[k]:'';
}

/* =========================================================================
   PARSE SKOR  ("11-9, 8-11, 11-7"  ->  detail per set + agregat)
========================================================================= */
function parseSkor(skor){
  if(!skor||!String(skor).trim()) return null;
  const raw=String(skor).replace(/–|—/g,'-'); // normalisasi tanda minus
  const parts=raw.split(/[,;]/);
  const sets=[]; let bad=false;
  for(const p of parts){
    const t=p.trim(); if(!t) continue;
    const m=t.match(/^(\d+)\s*-\s*(\d+)$/);
    if(!m){ bad=true; continue; }
    sets.push([parseInt(m[1],10),parseInt(m[2],10)]);
  }
  if(!sets.length) return {valid:false,bad:true,raw:skor};
  let setsA=0,setsB=0,ptsA=0,ptsB=0;
  for(const [a,b] of sets){ ptsA+=a; ptsB+=b; if(a>b)setsA++; else if(b>a)setsB++; }
  const winner = setsA>setsB?'A':(setsB>setsA?'B':null);
  return {valid:true, bad, raw:skor, sets, setsA, setsB, ptsA, ptsB, winner,
          display: sets.map(s=>s[0]+'-'+s[1]).join(', '), setSummary:setsA+'-'+setsB};
}
const isGrup = b => /^grup/i.test(String(b||'').trim());
const grupLetter = b => String(b||'').trim().split(/\s+/)[1] || '';

/* =========================================================================
   KLASEMEN
========================================================================= */
function hitungKlasemen(){
  const grupMap={}; // letter -> { pasangan -> stats }
  PESERTA.forEach(p=>{
    const g=String(pick(p,'Grup')).trim(); const nm=String(pick(p,'Pasangan')).trim();
    if(!g||!nm) return;
    (grupMap[g]=grupMap[g]||{})[nm]={pasangan:nm,M:0,W:0,L:0,Poin:0,SG:0,SL:0,SD:0,PW:0,PL:0,PD:0};
  });
  JADWAL.forEach(m=>{
    if(!isGrup(m.Babak)) return;
    const g=grupLetter(m.Babak);
    const A=m.TimA, B=m.TimB;
    const st=grupMap[g]; if(!st||!st[A]||!st[B]) return;
    const s=parseSkor(m.Skor); if(!s||!s.valid||!s.winner) return;
    st[A].M++; st[B].M++;
    st[A].SG+=s.setsA; st[A].SL+=s.setsB; st[A].PW+=s.ptsA; st[A].PL+=s.ptsB;
    st[B].SG+=s.setsB; st[B].SL+=s.setsA; st[B].PW+=s.ptsB; st[B].PL+=s.ptsA;
    if(s.winner==='A'){ st[A].W++; st[B].L++; } else { st[B].W++; st[A].L++; }
  });
  // finalisasi + urutan
  const result={};
  Object.keys(grupMap).sort().forEach(g=>{
    const arr=Object.values(grupMap[g]);
    arr.forEach(t=>{ t.Poin=t.W*2+t.L*1; t.SD=t.SG-t.SL; t.PD=t.PW-t.PL; });
    arr.sort((a,b)=>{
      if(b.Poin!==a.Poin) return b.Poin-a.Poin;
      if(b.SD!==a.SD)     return b.SD-a.SD;
      if(b.PD!==a.PD)     return b.PD-a.PD;
      const h=headToHead(g,a.pasangan,b.pasangan); if(h!==0) return h;
      return a.pasangan.localeCompare(b.pasangan);
    });
    result[g]=arr;
  });
  return result;
}
function headToHead(g,a,b){
  for(const m of JADWAL){
    if(!isGrup(m.Babak)||grupLetter(m.Babak)!==g) continue;
    const s=parseSkor(m.Skor); if(!s||!s.valid||!s.winner) continue;
    if(m.TimA===a&&m.TimB===b) return s.winner==='A'?-1:1;
    if(m.TimA===b&&m.TimB===a) return s.winner==='A'?1:-1;
  }
  return 0;
}
function grupSelesai(g){
  const ms=JADWAL.filter(m=>isGrup(m.Babak)&&grupLetter(m.Babak)===g);
  if(!ms.length) return false;
  return ms.every(m=>{ const s=parseSkor(m.Skor); return s&&s.valid&&s.winner; });
}

/* =========================================================================
   RESOLUSI TOKEN BRACKET  (JUARA_A, RUNNERUP_B, WIN_QF-1, LOSE_SF-1)
========================================================================= */
function resolveTeam(token, klas, guard){
  const t=String(token||'').trim();
  guard=guard||{};
  const mJR=t.match(/^(JUARA|RUNNERUP)_([A-Z])$/i);
  if(mJR){
    const g=mJR[2].toUpperCase(); const idx=/juara/i.test(mJR[1])?0:1;
    const lbl=(idx===0?'Juara':'Runner-up')+' Grup '+g;
    if(grupSelesai(g) && klas[g] && klas[g][idx]) return {name:klas[g][idx].pasangan,resolved:true,label:lbl};
    return {name:lbl,resolved:false,label:lbl};
  }
  const mWL=t.match(/^(WIN|LOSE)_(.+)$/i);
  if(mWL){
    const kind=mWL[1].toUpperCase(); const id=mWL[2].trim();
    const lbl=(kind==='WIN'?'Pemenang ':'Kalah ')+id;
    if(guard[id]) return {name:lbl,resolved:false,label:lbl}; // cegah rekursi
    guard[id]=true;
    const mm=JADWAL.find(x=>String(x.MatchID).trim()===id);
    if(!mm) return {name:lbl,resolved:false,label:lbl};
    const s=parseSkor(mm.Skor);
    if(!s||!s.valid||!s.winner) return {name:lbl,resolved:false,label:lbl};
    const winTok = s.winner==='A'?mm.TimA:mm.TimB;
    const loseTok= s.winner==='A'?mm.TimB:mm.TimA;
    const r=resolveTeam(kind==='WIN'?winTok:loseTok, klas, guard);
    return {name:r.name,resolved:r.resolved,label:lbl};
  }
  return {name:t,resolved:true,label:t}; // nama literal
}

/* =========================================================================
   RENDER — KLASEMEN
========================================================================= */
const KETLABEL={M:'Main',W:'Menang',L:'Kalah',Poin:'Poin',SG:'Set +',SL:'Set −',SD:'Sel. Set',PW:'Poin +',PL:'Poin −',PD:'Sel. Skor'};
function renderKlasemen(klas){
  const cols=['M','W','L','Poin','SG','SL','SD','PW','PL','PD'];
  const keyCols=new Set(['Poin','SD','PD']);
  let html='';
  Object.keys(klas).sort().forEach(g=>{
    const lolos=grupSelesai(g);
    html+=`<div class="grup"><div class="grup-h">GRUP ${g}${lolos?'':' <span style="font-weight:600;font-size:11px;opacity:.7">(berlangsung)</span>'}</div><div class="tbl-wrap"><table><thead><tr>`;
    html+=`<th class="nama">Pasangan Pemain</th>`;
    cols.forEach(c=>html+=`<th class="${keyCols.has(c)?'col-key':''}" title="${KETLABEL[c]}">${c}</th>`);
    html+=`</tr></thead><tbody>`;
    klas[g].forEach((t,i)=>{
      const isLolos=i<2;
      html+=`<tr class="${isLolos?'lolos':''}"><td class="nama"><span class="rank">${i+1}</span>${esc(t.pasangan)}${isLolos?`<span class="badge">${i===0?'JUARA':'RUNNER-UP'}</span>`:''}</td>`;
      cols.forEach(c=>{
        let v=t[c]; if(c==='SD'||c==='PD') v=(v>0?'+':'')+v;
        html+=`<td class="${keyCols.has(c)?'col-key':''}">${v}</td>`;
      });
      html+=`</tr>`;
    });
    html+=`</tbody></table></div></div>`;
  });
  html+=`<div class="legend">
    <b>Keterangan:</b> M=Main, W=Menang, L=Kalah, <b>Poin</b>=Poin Klasemen (Menang 2 · Kalah 1),
    SG/SL=Set Menang/Kalah, <b>SD</b>=Selisih Set, PW/PL=Poin (skor) Menang/Kalah, <b>PD</b>=Selisih Skor.<br>
    <b>2 teratas tiap grup (hijau) lolos ke babak 8 Besar.</b>
    Urutan peringkat: Poin → Selisih Set → Selisih Skor → hasil pertemuan langsung.
  </div>`;
  document.getElementById('view-klasemen').innerHTML=html;
}

/* =========================================================================
   RENDER — JADWAL
========================================================================= */
let filterAktif='Semua';
function renderJadwal(klas){
  const groupsFilter=['Semua','Grup A','Grup B','Grup C','Grup D','Knockout'];
  let html='<div class="filters">';
  groupsFilter.forEach(f=>html+=`<div class="chip ${filterAktif===f?'active':''}" data-f="${f}">${f}</div>`);
  html+='</div>';

  const match = m => {
    if(filterAktif==='Semua') return true;
    if(filterAktif==='Knockout') return !isGrup(m.Babak);
    return String(m.Babak).trim()===filterAktif;
  };
  const list=JADWAL.filter(match);

  // kelompokkan per tanggal
  const byDate={};
  list.forEach(m=>{ (byDate[m.Tanggal]=byDate[m.Tanggal]||[]).push(m); });

  Object.keys(byDate).forEach(tgl=>{
    html+=`<div class="j-tanggal">${esc(tgl)}</div><div class="j-tbl tbl-wrap"><table><thead><tr>
      <th>Match</th><th>Jam</th><th>Babak</th><th class="nama">Tim A</th><th>Skor</th><th class="nama">Tim B</th><th>Wasit</th></tr></thead><tbody>`;
    byDate[tgl].forEach(m=>{
      const ko=!isGrup(m.Babak);
      const A=resolveTeam(m.TimA,klas), B=resolveTeam(m.TimB,klas);
      const s=parseSkor(m.Skor);
      const aWin=s&&s.valid&&s.winner==='A', bWin=s&&s.valid&&s.winner==='B';
      const nameCell=(r,win)=>`<td class="nama"><span class="${win?'win':''} ${r.resolved?'':'tbd'}">${esc(r.name)}</span></td>`;
      let skorCell='<span class="vs">vs</span>';
      if(s&&s.valid) skorCell=`<span class="skor-pill" title="Set: ${s.setSummary}">${esc(s.display)}</span>`;
      else if(s&&s.bad) skorCell=`<span class="tbd" title="Format skor tidak terbaca">?</span>`;
      html+=`<tr>
        <td><span class="mid">${esc(m.MatchID)}</span></td>
        <td>${esc(m.Jam)}</td>
        <td><span class="tag ${ko?'ko':''}">${esc(m.Babak)}</span></td>
        ${nameCell(A,aWin)}
        <td>${skorCell}</td>
        ${nameCell(B,bWin)}
        <td>${esc(m.Wasit)}</td>
      </tr>`;
    });
    html+='</tbody></table></div>';
  });
  if(!list.length) html+='<div class="banner">Tidak ada pertandingan pada filter ini.</div>';
  const el=document.getElementById('view-jadwal');
  el.innerHTML=html;
  el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ filterAktif=c.dataset.f; renderJadwal(klas); });
}

/* =========================================================================
   RENDER — BRACKET 8 BESAR
========================================================================= */
function renderBracket(klas){
  const find=id=>JADWAL.find(m=>String(m.MatchID).trim()===id);
  const matchCard=(id)=>{
    const m=find(id); if(!m) return '';
    const A=resolveTeam(m.TimA,klas), B=resolveTeam(m.TimB,klas);
    const s=parseSkor(m.Skor);
    const aWin=s&&s.valid&&s.winner==='A', bWin=s&&s.valid&&s.winner==='B';
    const slot=(r,win,sc)=>`<div class="slot ${win?'winner':''}"><span class="nm ${r.resolved?'':'tbd'}">${esc(r.name)}</span><span class="sc">${sc}</span></div>`;
    return `<div class="match"><div class="m-id">${esc(m.MatchID)} · ${esc(m.Jam)}</div>
      ${slot(A,aWin, s&&s.valid?s.setsA:'')}
      ${slot(B,bWin, s&&s.valid?s.setsB:'')}</div>`;
  };
  let html='<div class="bracket">';
  html+=`<div class="round"><div class="round-title">Perempat Final</div>${matchCard('QF-1')}${matchCard('QF-2')}${matchCard('QF-3')}${matchCard('QF-4')}</div>`;
  html+=`<div class="round"><div class="round-title">Semifinal</div>${matchCard('SF-1')}${matchCard('SF-2')}</div>`;
  html+=`<div class="round final-wrap"><div class="round-title">Final</div>${matchCard('FINAL')}`;
  // juara
  const fin=find('FINAL'); const s=fin?parseSkor(fin.Skor):null;
  if(s&&s.valid&&s.winner){
    const champ=resolveTeam(s.winner==='A'?fin.TimA:fin.TimB,klas);
    if(champ.resolved) html+=`<div class="champion"><div class="lbl">🏆 JUARA</div><div class="nm">${esc(champ.name)}</div></div>`;
  }
  html+=`</div>`;
  html+='</div>';
  // perebutan juara 3
  html+=`<div style="margin-top:18px"><div class="round-title" style="text-align:left;margin-left:2px">Perebutan Juara 3</div><div style="max-width:230px">${matchCard('Juara 3')}</div></div>`;
  document.getElementById('view-bracket').innerHTML=html;
}

/* =========================================================================
   UTIL
========================================================================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function setStatus(text,type){ // type: ok|warn|err
  const el=document.getElementById('status'); el.className='status'+(type&&type!=='ok'?(' '+type):'');
  document.getElementById('statusText').textContent=text;
}
function showBanner(html,type){
  document.getElementById('banner').innerHTML = html?`<div class="banner ${type||''}">${html}</div>`:'';
}

/* =========================================================================
   LOAD DATA
========================================================================= */
function gvizURL(tab){
  return `https://docs.google.com/spreadsheets/d/${encodeURIComponent(SHEET_ID)}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;
}
async function fetchTab(tab){
  const res=await fetch(gvizURL(tab)+'&_cb='+Date.now(),{cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const text=await res.text();
  if(/^\s*</.test(text)) throw new Error('Sheet bukan publik / tab tidak ditemukan'); // dapat HTML login
  return csvToObjects(text);
}
async function loadData(){
  if(!SHEET_ID){
    PESERTA=DEMO_PESERTA; JADWAL=DEMO_JADWAL;
    setStatus('Mode Demo (belum tersambung Google Sheet)','warn');
    showBanner('Saat ini menampilkan <b>data contoh</b>. Untuk memakai data asli, isi <code>SHEET_ID</code> di file <code>index.html</code> dan sambungkan Google Sheet. Lihat <b>PANDUAN.md</b>.','');
    renderAll(); return;
  }
  try{
    setStatus('Memuat data…','ok');
    const [pes,jad]=await Promise.all([fetchTab(TAB_PESERTA),fetchTab(TAB_JADWAL)]);
    PESERTA=pes.map(o=>({Grup:pick(o,'Grup'),Pasangan:pick(o,'Pasangan')})).filter(p=>p.Pasangan);
    JADWAL=jad.map(o=>({
      MatchID:pick(o,'MatchID'),Tanggal:pick(o,'Tanggal'),Jam:pick(o,'Jam'),
      Babak:pick(o,'Babak'),Format:pick(o,'Format'),TimA:pick(o,'TimA'),
      TimB:pick(o,'TimB'),Wasit:pick(o,'Wasit'),Skor:pick(o,'Skor')
    })).filter(m=>m.MatchID);
    if(!PESERTA.length||!JADWAL.length) throw new Error('Data kosong (cek nama tab & isi Sheet)');
    setStatus('Tersambung ke Google Sheet','ok');
    showBanner('','');
    renderAll();
  }catch(e){
    PESERTA=DEMO_PESERTA; JADWAL=DEMO_JADWAL;
    setStatus('Gagal memuat Sheet — menampilkan data demo','err');
    showBanner('Gagal memuat Google Sheet: <b>'+esc(e.message)+'</b>. Pastikan Sheet dibagikan <i>"Anyone with the link: Viewer"</i> dan nama tab benar (<code>'+esc(TAB_PESERTA)+'</code>, <code>'+esc(TAB_JADWAL)+'</code>). Sementara menampilkan data demo.','err');
    renderAll();
  }
}
function renderAll(){
  const klas=hitungKlasemen();
  renderKlasemen(klas);
  renderJadwal(klas);
  renderBracket(klas);
  const now=new Date();
  document.getElementById('lastUpdate').textContent='Terakhir diperbarui '+
    String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
}

/* =========================================================================
   NAV & INIT
========================================================================= */
document.querySelectorAll('nav button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('view-'+b.dataset.view).classList.add('active');
  };
});
document.getElementById('btnRefresh').onclick=loadData;

loadData();
if(AUTO_REFRESH_DETIK>0 && SHEET_ID){
  refreshTimer=setInterval(loadData, AUTO_REFRESH_DETIK*1000);
}
</script>
